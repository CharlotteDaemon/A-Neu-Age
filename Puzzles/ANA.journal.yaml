Title: "Alchemical Discoveries of the Modern Era"
# Maybe "Acta Reductiva Metallurgicae" instead?
#but then the Volume number shouldn't be LXV, it should be I
Chapters:
- Title: "From the Notes of Ms. Maro, Issue I: Medicinal Recipes Accidentally Discovered"
  Description: "Although Caladia Maro has become known for her rediscovery and advancements in the field of Neuvolics, it was recently discovered that she had previously fabricated several medicinal recipes in a time of duress. Although they were all listed as 'failed' cures (Numbered as FC#1-#36), many of them have been found to be very useful in the general medicinal field."
  Puzzles:
  - "JRNL04FailedCureNum18"
  - "JRNL02FailedCureNum27"
  - "JRNL03FailedCureNum12"
  - "JRNL01FailedCureNum35"
  - "JRNL05FailedCureNum6"
- Title: "From the Notes of Ms. Maro, Issue II: Inspirations and Collaborations with Peers"
  Description: "Although most know her for her eclectic research style and strange habits, it's also true that Maro was very sociable and often worked with others both above and below her, regardless of their knowledge of the alchemical arts. This second issue highlights key studies and recipes that came from collaborations with her peers, or those who worked with her."
  Puzzles:
  - "ANA-JP2-HadriusTransformer"
  - "ANA-JP2-MetalOrder"
  - "ANA-JP2-PerfectSlag"
  - "ANA-JP2-FixationInv"
  - "ANA-JP2-Berlo2"
- Title: "Neuvolics, Rediscovered, Issue I: Uses for Neuvolics at Home"
  Description: "Volatile and reactive may be the default state of the Neuvolics, however, as decades pass, the number of use cases for them steadily rise. Many alchemists have demonstrated ways to placate the corrosive, destructive, and/or harmful natures of this elemental family, and others have found ways to harvest it. This short collection of recipes details several products and processes invented, patented, and distributed to the average household."
  Puzzles:
  - "ANA-JP3-WindFlame"
  - "ANA-JP3-Adhesive"
  - "ANA-JP3-RockSalt"
  - "ANA-JP3-WoodFinish"
  - "ANA-JP3-HeatControl"
- Title: "Volume CLXXXIII: Vacant Materials And Associated Prime (Part One)"
  Description: "Though the specific events of Fergus Ibra and associates--Sozar Peller and one which remains unnamed--are disputed in the historical record, the existence of the 'empty shell' metal, vaca, is beyond doubt. While its dim purple hue is now an informal symbol for air quality control and for lightweight materials, its other alchemical features require some introduction, given in the common exercises reprinted here."
  Puzzles:
  - 1-Elemental-Vaca
  - 2-Solder-Fragment
  - 3-Matryoshka
  - 4-Hollow-Flame
  - 5-Dust-to-Dust
- Title: "Volume CLXXXIV: Vacant Materials And Associated Prime (Part Two)"
  Description: "This supplementary material to the previous issue was found separated from the first half, and as such they are now published together, as they were originally meant to be together. It is unclear how originally only the first half of these alchemical discoveries were published, but it isn't uncommon for such things to slip through the cracks considering the chaotic and fast paced nature of the Post-Dictatorial-House era of the Alchemical Revolution."
  Puzzles:
  - 6-Extracted-Quicksilver
  - 7-Deposited-Vaca
  - 8-Wheel-Evacuation
  - 9-Engine-Repair
  - 10-Defiled-Bronze
- Title: "Volume CLXXXV: Vaca Refinement and Production"
  Description: "As the Vaca frontier is explored, many new methods of transmutation have been discovered, and some are confident enough to even say the rediscovery of the Vaca research marks the beginning of a second Alchemical Revolution. Confrences cannot be held often enough to accept the astounding amounts of new discoveries, thus a vote was held in the annual Alchemical Symposium. This issue contains five brand new challenges that force the reader to rethink their understanding of Vaca and it's capabilties."
  Puzzles:
  - ANA-JP6-ReGas
  - ANA-JP6-RAI
  - ANA-JP6-MR
  - ANA-JP6-VR
  - ANA-JP6-CR
- Title: "Volume CLXXXVI: Vaca Miscellanea"
  Description: "This issue marks our final forray into Vaca exclusive pages celebrating the revitalization the field of study has seen. Once considered a near useless element now proven to be incredibly helpfull. From refining methods of Aether collection, to alloys with considerable insulation properties, Vaca continues to amaze in it's simple, yet flexible properties."
  Puzzles:
  - ANA-JP7-Aether
  - ANA-JP7-Extraction
  - ANA-JP7-Explosive
  - ANA-JP7-SEMPER
  - ANA-JP7-Alloy
- Title: "Volume CLXXXVII: Editors Picks (I)"
  Description: "As the number of papers we recieve each day increases, our editors have suggested that we embrace this burgeoning third Alchemical Revolution by posting uncategorized discoveries and recipes. Here are a selection of favorites our editors have chosen for you to enjoy."
  Puzzles:
  - ANA-JP8-CapCrystal
  - ANA-JP8-WWP
  - ANA-JP8-Polarizing
  - ANA-JP8-EngineRein
  - ANA-JP8-Waltz
- Title: "Neuvolics, Rediscovered, Issue III: Neuvolics in Industry"
  Description: "The usefulness of Neuvolics in the greater Industrial World has proven itself to be expansive. From inhalants that prevent lung damage from harmful chemicals to durable lubricants, Neuvolics can be found in almost every corner of the industrial market."
  Puzzles:
  - ANA-JP9-FET
  - ANA-JP9-Electrode
  - ANA-JP9-Inhalants
  - ANA-JP9-Lubricant
  - ANA-JP9-Pest
- Title: "Grey Market Magazine: Anniversary Special"
  Description: "Hey Kids, do you want to see some cool $#!%? Well too bad! Step aside for the real #^@%ing adults who want cool chemicals! This issue, instead of listing products for drop shipping, we decided to show our hand. Now we know a good magician never reveals their secrets, but special times call for special events. Here are five brand new recipes sure to rustle your jimmies! (WARNING: GREY MARKET MAGAZINE IS IN NO WAY AFFILIATED OR SPONSORED BY THE JOURNAL OF THE ALCHEMICAL SYMPOSIUM)"
  Puzzles:
  - ANA-JP10-MERCHANT
  - ANA-JP10-Vitriol
  - ANA-JP10-FG
  - ANA-JP10-Chloro
  - ANA-JP10-DYE
- Title: "Neuvolics, Rediscovered, Issue IV: Neumetallic Alloys"
  Description: "Neuvolics share properties with both the Cardinals and Metals, making them excellent candidates for compact alloys. Though most of these discoveries come from trial and error, there is no doubt an underlying science governing it all. This issue aims to present a smattering of alloys that give a broad view of the versatile nature of the Neuvolics."
  Puzzles:
  - ANA-JP11-PrismaGold
  - ANA-JP11-RedVitriol
  - ANA-JP11-Magnets
  - ANA-JP11-Pyrophoric
  - ANA-JP11-SteelLike
- Title: "Neuvolics, Rediscovered, Issue V: Artistry and Jewelry"
  Description: "The exotic properties of the neuvolics may push most away from working with them, but those same exotic and dangerous properties are what makes them so alluring to others. Alongside the practical discoveries, a push for more decadent materials made from the Neuvolics has lead to new alternatives for products that had previously dominated their fields. We would still like to urge those who follow these recipes to practice proper safety procedures with handling materials made from Neuvolics."
  Puzzles:
  - ANA-JP12-Iridescent
  - ANA-JP12-ThickGlaze
  - ANA-JP12-RGB
  - ANA-JP12-Paints
  - ANA-JP12-CMYK
- Title: "Volume CLXXXVIII: Specialties of Half Metals (I)"
  Description: "Imagining a world without Half metals may be difficult, but that was the circumstance that the average alchemist would've found themselve in a little over one-hundred years ago. To celebrate a full century since Nickel, the first discovered half metal, was isolated, we have curated a special collection of Half Metallurgical studies. There is something here for all alchemists, young, old, novice or expert."
  Puzzles:
  - ANA-JP13-Osmic
  - ANA-JP13-Exotic
  - ANA-JP13-Wulframite
  - ANA-JP13-Taenite
  - ANA-JP13-Steel
- Title: "Neuvolics, Rediscovered, Issue VI: Neumetallic Ores"
  Description: "Finding a naturally occuring ore for each neumetal can be incredibly difficult, as the atoms tend to decay into other materials when left alone. However, it is still possible to find small deposits of the atoms hidden within other materials. These ores can be exotic, behaving in strange ways, or so simplistic that it's no wonder they stayed hiden away for centuries. These five studies show the most common way each Neumetal has been hiding right under our noses for the longest time."
  Puzzles:
  - ANA-JP15-Hestium
  - ANA-JP15-Azulum
  - ANA-JP15-Taceum
  - ANA-JP15-Iridium
  - ANA-JP15-Mitrum
- Title: "Grey Market Magazine: The True Anniversary Special"
  Description: "From the authors of the Grey Market Journal, we present our yearly special! This is our yearly thanks to both celebrate our founding anniversary and to thank you all, the buyers, for supporting our business. We have a bit of everything, from explosives that can break concrete to perfumes that will make people fall for you with a single sniff. Again, thank you so much for five years of support and we hope to continue producing useful products for decades to come! With much love, L. Flemming, Founder of Grey Market."
  Puzzles:
  - ANA-JP16-Archangel
  - ANA-JP16-Aphro
  - ANA-JP16-MindCtrl
  - ANA-JP16-Enlighten
  - ANA-JP16-Salvia